<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGA 24 - Control de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- ENCABEZADO Y MENÚ CORPORATIVO - VGA SECURITY 24 S.A. -->
  <header class="bg-slate-900 border-b border-slate-800 shadow-md mb-4">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- LOGO Y NOMBRE DE LA EMPRESA -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-slate-800 border border-emerald-500/30 rounded-xl flex items-center justify-center overflow-hidden shadow-inner p-1">
          <img src="https://i.ibb.co/qYcVxcTH/Chat-GPT-Image-3-sept-2026-13-19-18.png" alt="Logo VGA Security" class="w-full h-full object-contain">
        </div>
        <div>
          <span class="text-[10px] font-extrabold tracking-widest text-emerald-400 uppercase block">VGA Security 24 S.A.</span>
          <h1 class="text-lg font-bold text-white tracking-wide">Fichadas</h1>
        </div>
      </div>

      <!-- MENÚ DE NAVEGACIÓN RÁPIDA -->
      <nav class="flex flex-wrap justify-center items-center gap-1 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60">
        <a href="index.html" class="px-3 py-1.5 text-xs font-medium text-white bg-slate-700 rounded-lg transition flex items-center space-x-1.5 shadow-sm">
          <i class="fa-solid fa-camera-retro text-emerald-400"></i>
          <span>Fichadas</span>
        </a>
        <a href="admin.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-building-shield text-emerald-400"></i>
          <span>Centro de Operaciones</span>
        </a>
        <a href="panel.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-chart-line text-emerald-400"></i>
          <span>Control en Tiempo Real</span>
        </a>
        <a href="mis-horas.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-clock text-emerald-400"></i>
          <span>Control de Mis Horas</span>
        </a>
      </nav>

    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE FICHAJE -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-white tracking-wide uppercase">Registro de Asistencia</h2>
        <!-- INDICADOR DE RED OFFLINE/ONLINE -->
        <span id="estadoRed" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30">🟢 Online</span>
      </div>

      <!-- LEGAJO Y VALIDACIÓN -->
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">N° Legajo</label>
        <div class="relative">
          <input type="text" id="legajo" onblur="validarLegajo()" placeholder="Ingrese su legajo (ej: 0286)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
          <button type="button" onclick="validarLegajo()" class="absolute right-2 top-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2 py-1 rounded">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <p id="legajo-status" class="text-xs mt-1 hidden"></p>
      </div>

      <!-- NOMBRE (SE AUTOCOMPLETA) -->
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Nombre Completo</label>
        <input type="text" id="nombre" readonly placeholder="Se autocompletará con su legajo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-400 cursor-not-allowed">
      </div>

      <!-- PIN DE SEGURIDAD -->
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">PIN / Clave de Personal</label>
        <input type="password" id="pin" maxlength="6" placeholder="****" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
      </div>

      <!-- OBJETIVO / PUESTO (DESPLEGABLE DINÁMICO) -->
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Objetivo / Puesto</label>
        <select id="objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
          <option value="">Cargando objetivos...</option>
        </select>
      </div>

      <!-- CÁMARA -->
      <div class="space-y-2">
        <label class="block text-xs uppercase text-slate-400">Validación Facial</label>
        <div class="relative w-full h-48 bg-slate-950 rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center">
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
          <canvas id="canvas" class="hidden"></canvas>
          <img id="preview" class="w-full h-full object-cover hidden absolute inset-0 border-2 border-emerald-500">
        </div>
        <button type="button" onclick="capturarFoto()" class="w-full bg-amber-600 hover:bg-amber-500 text-xs py-2 rounded-lg font-bold transition">
          <i class="fa-solid fa-camera mr-2"></i>CAPTURAR FOTO
        </button>
        <p id="foto-status" class="text-xs text-rose-400 text-center font-semibold">⚠️ Foto no capturada</p>
      </div>

      <!-- BOTONES DE ENVÍO -->
      <div class="grid grid-cols-2 gap-4 pt-2">
        <button onclick="procesarEnvio('ENTRADA')" class="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">ENTRADA</button>
        <button onclick="procesarEnvio('SALIDA')" class="bg-rose-600 hover:bg-rose-500 font-bold py-3 rounded-xl transition">SALIDA</button>
      </div>

      <div id="resultado" class="hidden p-3 rounded-xl text-xs text-center"></div>
    </div>
  </main>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyLXk5Bg7qwGcl9Hl3i1-hkzPYzxCvBn7ZK1j5YS6toygWIvw8vi-diWhIYle23nFobuQ/exec";
    let fotoBase64Global = "";

    window.onload = function() {
      iniciarCamaraSegura();
      cargarObjetivos();
      actualizarEstadoRed();
      
      if (navigator.onLine) {
        sincronizarFichadasPendientes();
      }
    };

    window.addEventListener('online', () => {
      actualizarEstadoRed();
      sincronizarFichadasPendientes();
    });
    
    window.addEventListener('offline', actualizarEstadoRed);

    function iniciarCamaraSegura() {
      const status = document.getElementById('foto-status');
      
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
          .then(stream => { 
            document.getElementById('webcam').srcObject = stream; 
          })
          .catch(err => {
            console.warn("No se pudo iniciar la cámara automáticamente: ", err);
            status.innerText = "⚠️ Cámara pausada o sin permisos (pulse Capturar Foto)";
          });
      } else {
        status.innerText = "⚠️ Su navegador no soporta el acceso a la cámara";
      }
    }

    function actualizarEstadoRed() {
      const indicador = document.getElementById('estadoRed');
      if (!indicador) return;
      if (navigator.onLine) {
        indicador.className = "text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30";
        indicador.innerText = "🟢 Online";
      } else {
        indicador.className = "text-[11px] font-semibold px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-500/30";
        indicador.innerText = "⚠️ Modo Offline";
      }
    }

    function cargarObjetivos() {
      const selectObj = document.getElementById('objetivo');
      let objetivosGuardados = JSON.parse(localStorage.getItem('vga_lista_objetivos') || '[]');

      if (objetivosGuardados.length > 0) {
        poblarSelectObjetivos(objetivosGuardados);
      }

      if (navigator.onLine) {
        fetch(`${URL_APPS_SCRIPT}?tipo=objetivos`)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              let listaNuevos = [];
              data.forEach(item => {
                const nombreObj = item[1] || item[0];
                if (nombreObj) listaNuevos.push(nombreObj);
              });
              
              if (listaNuevos.length > 0) {
                localStorage.setItem('vga_lista_objetivos', JSON.stringify(listaNuevos));
                poblarSelectObjetivos(listaNuevos);
              }
            }
          })
          .catch(err => console.warn("No se pudieron actualizar los objetivos online:", err));
      } else if (objetivosGuardados.length === 0) {
        selectObj.innerHTML = '<option value="Don Pedro Hurlingham">Don Pedro Hurlingham (Modo Offline)</option><option value="Puesto General">Puesto General</option>';
      }
    }

    function poblarSelectObjetivos(lista) {
      const selectObj = document.getElementById('objetivo');
      let ultimoElegido = localStorage.getItem('vga_ultimo_objetivo') || '';
      
      selectObj.innerHTML = '<option value="">Seleccione un Objetivo</option>';
      
      lista.forEach(nombreObj => {
        const opt = document.createElement('option');
        opt.value = nombreObj;
        opt.textContent = nombreObj;
        if (nombreObj === ultimoElegido) {
          opt.selected = true;
        }
        selectObj.appendChild(opt);
      });
    }

    function validarLegajo() {
      const legajo = document.getElementById('legajo').value.trim();
      const statusLbl = document.getElementById('legajo-status');
      
      if (!legajo) return;

      if (!navigator.onLine) {
        statusLbl.className = "text-xs mt-1 text-slate-400 block";
        statusLbl.innerText = "Modo Offline: Verificación en servidor omitida.";
        return;
      }

      statusLbl.className = "text-xs mt-1 text-amber-400 block";
      statusLbl.innerText = "Buscando legajo...";

      fetch(`${URL_APPS_SCRIPT}?tipo=validarVigilador&legajo=${encodeURIComponent(legajo)}`)
        .then(res => res.json())
        .then(data => {
          if (data.existe) {
            document.getElementById('nombre').value = data.nombreOficial || "";
            statusLbl.className = "text-xs mt-1 text-emerald-400 block";
            statusLbl.innerText = `✓ Guardia: ${data.nombreOficial || 'Legajo Encontrado'}`;
          } else {
            document.getElementById('nombre').value = "";
            statusLbl.className = "text-xs mt-1 text-rose-400 block";
            statusLbl.innerText = data.mensaje || "❌ Legajo no encontrado.";
          }
        })
        .catch(() => {
          statusLbl.className = "text-xs mt-1 text-slate-400 block";
          statusLbl.innerText = "Modo de verificación manual habilitado.";
        });
    }

    function capturarFoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const preview = document.getElementById('preview');
      const status = document.getElementById('foto-status');

      if (!video.srcObject && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
          .then(stream => {
            video.srcObject = stream;
            setTimeout(() => realizarCapturaCanvas(video, canvas, preview, status), 300);
          })
          .catch(err => {
            alert("No se pudo acceder a la cámara. Verifique los permisos del navegador.");
          });
        return;
      }

      realizarCapturaCanvas(video, canvas, preview, status);
    }

    function realizarCapturaCanvas(video, canvas, preview, status) {
      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      fotoBase64Global = canvas.toDataURL('image/jpeg', 0.6);
      
      preview.src = fotoBase64Global;
      preview.classList.remove('hidden');
      status.innerText = "✓ Foto capturada correctamente";
      status.className = "text-xs text-emerald-400 text-center font-semibold";
    }

    function procesarEnvio(tipoRecibido) {
      const tipo = String(tipoRecibido).trim().toUpperCase();

      const legajo = document.getElementById('legajo').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const objetivo = document.getElementById('objetivo').value;

      if (!legajo || !pin || !objetivo) {
        alert("Por favor complete su N° de Legajo, PIN de Seguridad y seleccione un Objetivo.");
        return;
      }

      localStorage.setItem('vga_ultimo_objetivo', objetivo);

      if (!fotoBase64Global) {
        alert("Primero haga clic en 'CAPTURAR FOTO'.");
        return;
      }

      const divResultado = document.getElementById('resultado');
      divResultado.className = "p-3 rounded-xl text-xs text-center bg-slate-700 text-white";
      divResultado.innerText = "Obteniendo ubicación GPS...";
      divResultado.classList.remove('hidden');

      if (!navigator.geolocation) {
        divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
        divResultado.innerText = "❌ El dispositivo/navegador no soporta localización GPS.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (!lat || !lng || lat === 0 || lng === 0) {
            divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
            divResultado.innerText = "❌ No se obtuvo una coordenada GPS válida. Activa la ubicación para fichar.";
            return;
          }

          ejecutarPeticionFichada(tipo, lat, lng, legajo, pin, nombre, objetivo);
        },
        err => {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
          divResultado.innerText = "❌ Permiso de GPS denegado o no disponible. Activa la ubicación en tu dispositivo.";
        },
        { timeout: 7000, enableHighAccuracy: true }
      );
    }

    function ejecutarPeticionFichada(tipo, lat, lng, legajo, pin, nombre, objetivo) {
      const datos = {
        legajo: legajo,
        pin: pin,
        nombre: nombre || ("Legajo " + legajo),
        objetivo: objetivo,
        tipo: tipo, 
        latitud: lat,
        longitud: lng,
        fotoBase64: fotoBase64Global,
        fechaHoraDispositivo: new Date().toISOString() // Captura el momento exacto en que se realiza la marcación
      };

      const divResultado = document.getElementById('resultado');

      if (!navigator.onLine) {
        guardarFichadaOffline(datos, tipo);
        return;
      }

      divResultado.className = "p-3 rounded-xl text-xs text-center bg-slate-700 text-white";
      divResultado.innerText = "Enviando fichada al servidor...";
      divResultado.classList.remove('hidden');

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(datos)
      })
      .then(res => res.json())
      .then(respuesta => {
        if (respuesta.exito === true) {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-emerald-950 text-emerald-200 border border-emerald-500";
          divResultado.innerText = `✓ ¡Fichada de ${tipo} registrada con éxito!`;
          
          document.getElementById('pin').value = "";
          document.getElementById('legajo').value = "";
          document.getElementById('nombre').value = "";

          setTimeout(() => { 
            location.reload(); 
          }, 1500);

        } else {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
          divResultado.innerText = respuesta.mensaje || "❌ Acción rechazada por el servidor.";
        }
      })
      .catch(err => {
        console.warn("Fallo de red al enviar. Guardando offline automáticamente...", err);
        guardarFichadaOffline(datos, tipo);
      });
    }

    function guardarFichadaOffline(datos, tipo) {
      let pendientes = JSON.parse(localStorage.getItem('fichadas_pendientes') || '[]');
      pendientes.push(datos);
      localStorage.setItem('fichadas_pendientes', JSON.stringify(pendientes));

      const divResultado = document.getElementById('resultado');
      divResultado.className = "p-3 rounded-xl text-xs text-center bg-amber-950 text-amber-200 border border-amber-500";
      divResultado.innerText = `⚠️ Sin conexión. Tu fichada de ${tipo} fue guardada en el dispositivo y se enviará al recuperar internet.`;

      document.getElementById('pin').value = "";
      document.getElementById('legajo').value = "";
      document.getElementById('nombre').value = "";

      setTimeout(() => { 
        location.reload(); 
      }, 3000);
    }

    function sincronizarFichadasPendientes() {
      let pendientes = JSON.parse(localStorage.getItem('fichadas_pendientes') || '[]');
      if (pendientes.length === 0) return;

      if (!navigator.onLine) return;

      let datos = pendientes[0];

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(datos)
      })
      .then(res => res.json())
      .then(respuesta => {
        if (respuesta.exito === true || respuesta.exito === false) {
          // Independientemente de la respuesta, si ya procesó o descartó la pendiente local, avanzamos la cola
          pendientes.shift();
          localStorage.setItem('fichadas_pendientes', JSON.stringify(pendientes));
          
          if (pendientes.length > 0) {
            sincronizarFichadasPendientes();
          } else {
            console.log("🔄 Todas las fichadas pendientes fueron sincronizadas con éxito.");
          }
        }
      })
      .catch(err => {
        console.error("Error al sincronizar fichada pendiente, se reintentará más tarde.", err);
      });
    }
  </script>
</body>
</html>
