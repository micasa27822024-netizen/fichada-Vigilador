<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-4">
    <h1 class="text-xl font-bold text-center text-white tracking-wide uppercase">Control de Asistencia</h1>

    <!-- LEGAJO Y VALIDACIÓN -->
    <div>
      <label class="block text-xs uppercase text-slate-400 mb-1">N° Legajo</label>
      <div class="relative">
        <input type="number" id="legajo" onblur="validarLegajo()" placeholder="Ingrese su legajo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
        <button type="button" onclick="validarLegajo()" class="absolute right-2 top-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2 py-1 rounded">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <p id="legajo-status" class="text-xs mt-1 hidden"></p>
    </div>

    <!-- NOMBRE (SE AUTOCOMPLETA) -->
    <div>
      <label class="block text-xs uppercase text-slate-400 mb-1">Nombre Completo</label>
      <input type="text" id="nombre" readonly placeholder="Se autocompletará con su legajo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-400 cursor-not-allowed">
    </div>

    <!-- PIN DE SEGURIDAD -->
    <div>
      <label class="block text-xs uppercase text-slate-400 mb-1">PIN / Clave de Personal</label>
      <input type="password" id="pin" maxlength="6" placeholder="****" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
    </div>

    <!-- OBJETIVO / PUESTO (DESPLEGABLE DINÁMICO) -->
    <div>
      <label class="block text-xs uppercase text-slate-400 mb-1">Objetivo / Puesto</label>
      <select id="objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
        <option value="">Cargando objetivos...</option>
      </select>
    </div>

    <!-- CÁMARA -->
    <div class="space-y-2">
      <label class="block text-xs uppercase text-slate-400">Validación Facial</label>
      <div class="relative w-full h-48 bg-slate-950 rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>
        <img id="preview" class="w-full h-full object-cover hidden absolute inset-0 border-2 border-emerald-500">
      </div>
      <button type="button" onclick="capturarFoto()" class="w-full bg-amber-600 hover:bg-amber-500 text-xs py-2 rounded-lg font-bold transition">
        <i class="fa-solid fa-camera mr-2"></i>CAPTURAR FOTO
      </button>
      <p id="foto-status" class="text-xs text-rose-400 text-center font-semibold">⚠️ Foto no capturada</p>
    </div>

    <!-- BOTONES DE ENVÍO -->
    <div class="grid grid-cols-2 gap-4 pt-2">
      <button onclick="procesarEnvio('ENTRADA')" class="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">ENTRADA</button>
      <button onclick="procesarEnvio('SALIDA')" class="bg-rose-600 hover:bg-rose-500 font-bold py-3 rounded-xl transition">SALIDA</button>
    </div>

    <div id="resultado" class="hidden p-3 rounded-xl text-xs text-center"></div>
  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzrRRD924v9JIRLjypInemrhhxLKOF2wsYcet3ZyhPBXjyYdH7ytNj1jJYfSNnZmtw8AQ/exec";
    let fotoBase64Global = "";

    window.onload = function() {
      // Iniciar cámara
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => { document.getElementById('webcam').srcObject = stream; })
        .catch(err => alert("Error al acceder a la cámara: " + err));

      // Cargar lista de objetivos
      cargarObjetivos();
    };

    function cargarObjetivos() {
      fetch(`${URL_APPS_SCRIPT}?tipo=objetivos`)
        .then(res => res.json())
        .then(data => {
          const selectObj = document.getElementById('objetivo');
          selectObj.innerHTML = '<option value="">Seleccione un Objetivo</option>';
          if (Array.isArray(data) && data.length > 0) {
            data.forEach(item => {
              // Si la fila tiene nombre de objetivo (Columna B / Índice 1)
              const nombreObj = item[1] || item[0];
              if (nombreObj) {
                const opt = document.createElement('option');
                opt.value = nombreObj;
                opt.textContent = nombreObj;
                selectObj.appendChild(opt);
              }
            });
          } else {
            selectObj.innerHTML = '<option value="Puesto General">Puesto General</option>';
          }
        })
        .catch(() => {
          document.getElementById('objetivo').innerHTML = '<option value="Puesto General">Puesto General</option>';
        });
    }

    function validarLegajo() {
      const legajo = document.getElementById('legajo').value.trim();
      const statusLbl = document.getElementById('legajo-status');
      
      if (!legajo) return;

      statusLbl.className = "text-xs mt-1 text-amber-400 block";
      statusLbl.innerText = "Buscando legajo...";

      fetch(`${URL_APPS_SCRIPT}?tipo=validarVigilador&legajo=${legajo}`)
        .then(res => res.json())
        .then(data => {
          if (data.existe) {
            document.getElementById('nombre').value = data.nombreOficial || "";
            statusLbl.className = "text-xs mt-1 text-emerald-400 block";
            statusLbl.innerText = `✓ Guardia: ${data.nombreOficial || 'Legajo Encontrado'}`;
          } else {
            document.getElementById('nombre').value = "";
            statusLbl.className = "text-xs mt-1 text-rose-400 block";
            statusLbl.innerText = data.mensaje || "❌ Legajo no encontrado.";
          }
        })
        .catch(() => {
          statusLbl.className = "text-xs mt-1 text-slate-400 block";
          statusLbl.innerText = "Modo de verificación manual habilitado.";
        });
    }

    function capturarFoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const preview = document.getElementById('preview');
      const status = document.getElementById('foto-status');

      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      fotoBase64Global = canvas.toDataURL('image/jpeg', 0.6);
      
      preview.src = fotoBase64Global;
      preview.classList.remove('hidden');
      status.innerText = "✓ Foto capturada correctamente";
      status.className = "text-xs text-emerald-400 text-center font-semibold";
    }

    function procesarEnvio(tipo) {
      const legajo = document.getElementById('legajo').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const objetivo = document.getElementById('objetivo').value;

      if (!legajo || !pin || !objetivo) {
        alert("Por favor complete su N° de Legajo, PIN de Seguridad y seleccione un Objetivo.");
        return;
      }

      if (!fotoBase64Global) {
        alert("Primero haga clic en 'CAPTURAR FOTO'.");
        return;
      }

      const divResultado = document.getElementById('resultado');
      divResultado.className = "p-3 rounded-xl text-xs text-center bg-slate-700 text-white";
      divResultado.innerText = "Obteniendo ubicación GPS...";
      divResultado.classList.remove('hidden');

      if (!navigator.geolocation) {
        divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
        divResultado.innerText = "❌ El dispositivo/navegador no soporta localización GPS.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (!lat || !lng || lat === 0 || lng === 0) {
            divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
            divResultado.innerText = "❌ No se obtuvo una coordenada GPS válida. Activa la ubicación para fichar.";
            return;
          }

          enviarFichada(tipo, lat, lng, legajo, pin, nombre, objetivo);
        },
        err => {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
          divResultado.innerText = "❌ Permiso de GPS denegado o no disponible. Activa la ubicación en tu dispositivo.";
        },
        { timeout: 7000, enableHighAccuracy: true }
      );
    }

    function enviarFichada(tipo, lat, lng, legajo, pin, nombre, objetivo) {
      const datos = {
        legajo: legajo,
        pin: pin,
        nombre: nombre,
        objetivo: objetivo,
        tipo: tipo,
        latitud: lat,
        longitud: lng,
        fotoBase64: fotoBase64Global
      };

      const divResultado = document.getElementById('resultado');
      divResultado.innerText = "Validando PIN y registrando fichada...";

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(datos)
      })
      .then(res => res.json())
      .then(res => {
        if (res.exito) {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-emerald-950 text-emerald-200 border border-emerald-500";
          divResultado.innerText = `✓ Fichada de ${tipo} registrada exitosamente.`;
          // Limpiar campo de PIN tras fichar
          document.getElementById('pin').value = "";
        } else {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
          divResultado.innerText = "❌ " + (res.mensaje || "Error al procesar la fichada.");
        }
      })
      .catch(err => {
        divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
        divResultado.innerText = "Error de envío: " + err;
      });
    }
  </script>
</body>
</html>
