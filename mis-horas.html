<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyYridm7GmyEbFC6heaMspOC6Atewg3RbRX2EGrhTqMPojX0Y5veGbFgt0X61CWUWincw/exec";

    let temporizadorInactividad;

    // Función para reiniciar el contador de inactividad
    function reiniciarTemporizador() {
      clearTimeout(temporizadorInactividad);
      // 180000 milisegundos = exactamente 3 minutos
      temporizadorInactividad = setTimeout(() => {
        if (sessionStorage.getItem('vigilador_legajo')) {
          console.log("Cerrando sesión por inactividad de 3 minutos...");
          cerrarSesionVigilador();
          alert("Sesión cerrada automáticamente por 3 minutos de inactividad.");
        }
      }, 180000); 
    }

    // Al cargar la página, verificamos si hay una sesión guardada
    window.onload = function() {
      const legajoGuardado = sessionStorage.getItem('vigilador_legajo');
      if (legajoGuardado) {
        document.getElementById('legajoInput').value = legajoGuardado;
        document.getElementById('formLoginVigilador').classList.add('hidden');
        document.getElementById('infoSesionActiva').classList.remove('hidden');
        document.getElementById('lblLegajoActivo').innerText = legajoGuardado;
        document.getElementById('btnCerrarSesion').classList.remove('hidden');
        
        ejecutarConsulta(legajoGuardado);
        
        // Activar el monitoreo de inactividad si hay sesión iniciada
        activarEscuchasInactividad();
        reiniciarTemporizador();
      }
    };

    function activarEscuchasInactividad() {
      window.addEventListener('mousemove', reiniciarTemporizador);
      window.addEventListener('mousedown', reiniciarTemporizador);
      window.addEventListener('keypress', reiniciarTemporizador);
      window.addEventListener('touchstart', reiniciarTemporizador); // Soporte para celulares/tablets
    }

    function calcularHoras(f1, f2) {
      let inicio = new Date(f1);
      let fin = new Date(f2);
      if (isNaN(inicio) || isNaN(fin) || fin <= inicio) return { d: 0, n: 0, t: 0 };

      let diurnas = 0, nocturnas = 0;
      let cur = new Date(inicio);

      while (cur < fin) {
        let h = cur.getHours();
        if (h >= 6 && h < 21) diurnas += 1/60;
        else nocturnas += 1/60;
        cur.setMinutes(cur.getMinutes() + 1);
      }
      return { d: diurnas, n: nocturnas, t: diurnas + nocturnas };
    }

    function buscarMisHoras() {
      const legajo = document.getElementById('legajoInput').value.trim();
      const pin = document.getElementById('pinInput').value.trim();

      if (!legajo || !pin) {
        return alert("Por favor ingresa tu número de legajo y tu PIN de seguridad.");
      }

      fetch(URL_APPS_SCRIPT)
        .then(res => res.json())
        .then(datos => {
          const marcacionesVigilador = datos.filter(f => String(f[1]).trim() === legajo);
          
          if (marcacionesVigilador.length === 0) {
            alert("No se encontraron registros para el legajo ingresado.");
            return;
          }

          // Guardamos sesión segura en el navegador
          sessionStorage.setItem('vigilador_legajo', legajo);

          document.getElementById('formLoginVigilador').classList.add('hidden');
          document.getElementById('infoSesionActiva').classList.remove('hidden');
          document.getElementById('lblLegajoActivo').innerText = legajo;
          document.getElementById('btnCerrarSesion').classList.remove('hidden');

          procesarYRenderizar(marcacionesVigilador);
          
          // Activar monitoreo y temporizador
          activarEscuchasInactividad();
          reiniciarTemporizador();
        })
        .catch(err => {
          console.error(err);
          alert("Ocurrió un error al consultar las marcaciones.");
        });
    }

    function ejecutarConsulta(legajo) {
      fetch(URL_APPS_SCRIPT)
        .then(res => res.json())
        .then(datos => {
          const marcacionesVigilador = datos.filter(f => String(f[1]).trim() === legajo);
          if (marcacionesVigilador.length > 0) {
            procesarYRenderizar(marcacionesVigilador);
          }
        })
        .catch(err => console.error(err));
    }

    function procesarYRenderizar(marcacionesVigilador) {
      marcacionesVigilador.sort((a, b) => new Date(a[0]) - new Date(b[0]));

      let totalD = 0, totalN = 0, totalT = 0;
      const tabla = document.getElementById('cuerpoDetalle');
      tabla.innerHTML = "";

      for (let i = 0; i < marcacionesVigilador.length; i++) {
        if (marcacionesVigilador[i][4] === 'ENTRADA') {
          let entrada = marcacionesVigilador[i];
          let salida = marcacionesVigilador[i + 1] && marcacionesVigilador[i + 1][4] === 'SALIDA' ? marcacionesVigilador[i + 1] : null;

          let horas = salida ? calcularHoras(entrada[0], salida[0]) : { d: 0, n: 0, t: 0 };
          let objetivoNombre = entrada[3] || (salida && salida[3]) || '-';

          totalD += horas.d;
          totalN += horas.n;
          totalT += horas.t;

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-700/30 transition";
          tr.innerHTML = `
            <td class="p-4 text-xs font-mono">${new Date(entrada[0]).toLocaleString('es-AR', { hour12: false })}</td>
            <td class="p-4 text-xs font-mono">${salida ? new Date(salida[0]).toLocaleString('es-AR', { hour12: false }) : '<span class="text-amber-400">En Turno</span>'}</td>
            <td class="p-4 text-xs text-slate-300 font-medium">${objetivoNombre}</td>
            <td class="p-4 text-center text-xs font-semibold text-amber-400">${horas.d.toFixed(2)} hs</td>
            <td class="p-4 text-center text-xs font-semibold text-indigo-400">${horas.n.toFixed(2)} hs</td>
            <td class="p-4 text-center text-xs font-bold text-emerald-400">${horas.t.toFixed(2)} hs</td>
          `;
          tabla.appendChild(tr);
        }
      }

      document.getElementById('horasDiurnas').innerText = `${totalD.toFixed(2)} hs`;
      document.getElementById('horasNocturnas').innerText = `${totalN.toFixed(2)} hs`;
      document.getElementById('horasTotales').innerText = `${totalT.toFixed(2)} hs`;

      document.getElementById('resumenHoras').classList.remove('hidden');
      document.getElementById('contenedorTabla').classList.remove('hidden');
    }

    function cerrarSesionVigilador() {
      // Limpiar temporizador y memoria de sesión
      clearTimeout(temporizadorInactividad);
      sessionStorage.removeItem('vigilador_legajo');
      
      // Ocultar elementos de datos y volver a mostrar el login limpio
      document.getElementById('formLoginVigilador').classList.remove('hidden');
      document.getElementById('infoSesionActiva').classList.add('hidden');
      document.getElementById('btnCerrarSesion').classList.add('hidden');
      document.getElementById('resumenHoras').classList.add('hidden');
      document.getElementById('contenedorTabla').classList.add('hidden');
      
      // Limpiar campos de texto del login
      document.getElementById('legajoInput').value = '';
      document.getElementById('pinInput').value = '';
    }
  </script>
