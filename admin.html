<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Marcaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- ENCABEZADO -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-clipboard-user text-emerald-500"></i> Panel de Marcaciones
        </h1>
        <p class="text-xs text-slate-400 mt-1">Supervisión e historial de asistencia en tiempo real</p>
      </div>
      
      <button onclick="cargarDatos()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg">
        <i class="fa-solid fa-rotate-right" id="icono-reload"></i> Actualizar Datos
      </button>
    </div>

    <!-- FILTROS Y BÚSQUEDA -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-col md:flex-row gap-4">
      <div class="flex-1 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="inputBusqueda" onkeyup="filtrarTabla()" placeholder="Buscar por Nombre, Legajo u Objetivo..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <select id="filtroTipo" onchange="filtrarTabla()" class="w-full md:w-auto bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="TODOS">Todos los tipos</option>
          <option value="ENTRADA">Solo Entradas</option>
          <option value="SALIDA">Solo Salidas</option>
        </select>
      </div>
    </div>

    <!-- TABLA DE REGISTROS -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-700">
            <tr>
              <th class="p-4">Fecha y Hora</th>
              <th class="p-4">Legajo</th>
              <th class="p-4">Nombre</th>
              <th class="p-4">Objetivo</th>
              <th class="p-4 text-center">Tipo</th>
              <th class="p-4 text-center">Ubicación</th>
              <th class="p-4 text-center">Foto</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla" class="divide-y divide-slate-700/50">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-500 mb-2"></i>
                <p>Cargando información...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODAL DE VISUALIZACIÓN DE FOTO -->
  <div id="modalFoto" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-lg w-full relative space-y-4">
      <button onclick="cerrarModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="font-bold text-white text-base">Foto de Marcación</h3>
      <div class="w-full h-80 bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center">
        <img id="imgModal" src="" alt="Foto Fichada" class="w-full h-full object-contain">
      </div>
    </div>
  </div>

  <script>
    // URL desplegada de Google Apps Script
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycby_pYl-pIBgd5Zr22tllEVMCyHe-jT_FpYUH9VbDHu2ds4zRTSEJC0h90IujJqBqXaHhQ/exec";
    
    let datosLocales = [];

    window.onload = function() {
      cargarDatos();
    };

    function cargarDatos() {
      const icono = document.getElementById('icono-reload');
      icono.classList.add('fa-spin');

      fetch(URL_APPS_SCRIPT)
        .then(res => res.json())
        .then(data => {
          datosLocales = data;
          renderizarTabla(data);
        })
        .catch(err => {
          console.error(err);
          document.getElementById('cuerpoTabla').innerHTML = `
            <tr>
              <td colspan="7" class="p-8 text-center text-rose-400">
                <i class="fa-solid fa-circle-exclamation text-xl mb-1"></i>
                <p>Error al obtener registros. Verifica la URL de Apps Script.</p>
              </td>
            </tr>`;
        })
        .finally(() => {
          icono.classList.remove('fa-spin');
        });
    }

    function renderizarTabla(registros) {
      const cuerpo = document.getElementById('cuerpoTabla');
      cuerpo.innerHTML = "";

      if (!registros || registros.length === 0) {
        cuerpo.innerHTML = `
          <tr>
            <td colspan="7" class="p-8 text-center text-slate-400">No hay registros cargados aún.</td>
          </tr>`;
        return;
      }

      // Ordenar por fecha descendente (los más recientes primero)
      const ordenados = [...registros].reverse();

      ordenados.forEach(fila => {
        const fecha = fila[0] ? new Date(fila[0]).toLocaleString('es-AR') : '-';
        const legajo = fila[1] || '-';
        const nombre = fila[2] || '-';
        const objetivo = fila[3] || '-';
        const tipo = fila[4] || '-';
        const urlMapa = fila[5] || '';
        const urlFoto = fila[6] || '';

        const badgeColor = tipo === 'ENTRADA' 
          ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
          : 'bg-rose-500/10 text-rose-400 border-rose-500/20';

        const btnMapa = (urlMapa && urlMapa.includes('http'))
          ? `<a href="${urlMapa}" target="_blank" class="inline-flex items-center gap-1 bg-sky-600/20 text-sky-400 hover:bg-sky-600/40 border border-sky-500/30 px-3 py-1 rounded-lg text-xs font-semibold transition">
              <i class="fa-solid fa-map-location-dot"></i> Mapa
             </a>`
          : `<span class="text-xs text-slate-500">Sin GPS</span>`;

        const btnFoto = (urlFoto && urlFoto.includes('http'))
          ? `<button onclick="abrirFoto('${urlFoto}')" class="inline-flex items-center gap-1 bg-amber-600/20 text-amber-400 hover:bg-amber-600/40 border border-amber-500/30 px-3 py-1 rounded-lg text-xs font-semibold transition">
              <i class="fa-solid fa-image"></i> Ver Foto
             </button>`
          : `<span class="text-xs text-slate-500">Sin Foto</span>`;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-700/30 transition";
        tr.innerHTML = `
          <td class="p-4 font-mono text-xs text-slate-300">${fecha}</td>
          <td class="p-4 font-semibold text-white">${legajo}</td>
          <td class="p-4 font-medium text-slate-200">${nombre}</td>
          <td class="p-4 text-slate-400">${objetivo}</td>
          <td class="p-4 text-center">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold border ${badgeColor}">${tipo}</span>
          </td>
          <td class="p-4 text-center">${btnMapa}</td>
          <td class="p-4 text-center">${btnFoto}</td>
        `;
        cuerpo.appendChild(tr);
      });
    }

    function filtrarTabla() {
      const busqueda = document.getElementById('inputBusqueda').value.toLowerCase();
      const filtroTipo = document.getElementById('filtroTipo').value;

      const filtrados = datosLocales.filter(fila => {
        const textoFila = `${fila[1]} ${fila[2]} ${fila[3]}`.toLowerCase();
        const coincideBusqueda = textoFila.includes(busqueda);
        const coincideTipo = (filtroTipo === 'TODOS') || (fila[4] === filtroTipo);

        return coincideBusqueda && coincideTipo;
      });

      renderizarTabla(filtrados);
    }

    function abrirFoto(url) {
      document.getElementById('imgModal').src = url;
      document.getElementById('modalFoto').classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modalFoto').classList.add('hidden');
      document.getElementById('imgModal').src = "";
    }
  </script>
</body>
</html>
